{% extends "common_base.html" %}

{% block content %}

<div class="container">
  {% include "_alert_messages.html" with context %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-2">Login</h2>
                    <p class="text-center small text-muted mb-2">Step 2 of 2</p>
                    <p class="text-center mb-4">Login in progress for <span class="text-success">{{ user_id }}</span></p>
                    <form method="POST">
                        <input type="hidden" name="user_id" value="{{ user_id }}">
                        <input type="hidden" name="apisession" value="{{ apisession if apisession is not none else '' }}">
                        <div class="mb-4">
                            <label class="form-label">Enter your challenge fragment (the part you remembered)</label>
                            <input type="text" required class="form-control text-center" name="secret_user" value="{{secret_user}}">
                        </div>
                        <div class="mb-3">
                            <button type="submit" class="btn btn-primary fw-light w-100" name="action" value="Submit">Submit</button>
                        </div>
                        <p class="text-center mt-3 small mb-0"><a href="/register/correct" class="link-primary">Wrong credentials? Sign in with Google to update them</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
