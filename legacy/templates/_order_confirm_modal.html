{# Reusable order confirmation modal. Include once per page. Use window.openOrderConfirmModal(payload) to show. #}
<style>
  .order-confirm-action { padding: 0.15em 0.4em; border-radius: 0.25em; font-weight: 600; }
  .order-confirm-action-buy { background-color: var(--bs-success); color: #fff; }
  .order-confirm-action-sell { background-color: var(--bs-danger); color: #fff; }
</style>
<div class="modal fade" id="orderConfirmModal" tabindex="-1" aria-labelledby="orderConfirmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="orderConfirmModalLabel">Confirm order</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="orderConfirmModalBody">
        <p class="mb-3" id="orderConfirmModalSummary">—</p>
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label small text-secondary">Quantity</label>
            <input type="number" class="form-control form-control-sm" id="orderConfirmModalQty" min="1" placeholder="Qty">
          </div>
          <div class="col-6">
            <label class="form-label small text-secondary">Price (₹)</label>
            <input type="number" step="0.05" class="form-control form-control-sm" id="orderConfirmModalPrice" placeholder="Price">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="orderConfirmModalSubmit">Confirm order</button>
      </div>
    </div>
  </div>
</div>
<form id="orderConfirmForm" method="POST" action="/order" style="display: none;">
  <input type="hidden" name="product_type" id="orderConfirm_product_type" value="Options">
  <input type="hidden" name="stock_code" id="orderConfirm_stock_code">
  <input type="hidden" name="exchange_code" id="orderConfirm_exchange_code">
  <input type="hidden" name="expiry_date" id="orderConfirm_expiry_date">
  <input type="hidden" name="right" id="orderConfirm_right">
  <input type="hidden" name="strike_price" id="orderConfirm_strike_price">
  <input type="hidden" name="quantity" id="orderConfirm_quantity">
  <input type="hidden" name="price" id="orderConfirm_price">
  <input type="hidden" name="action" id="orderConfirm_action">
</form>
<script>
(function() {
  var modalEl = document.getElementById('orderConfirmModal');
  var bodyEl = document.getElementById('orderConfirmModalBody');
  var summaryEl = document.getElementById('orderConfirmModalSummary');
  var formEl = document.getElementById('orderConfirmForm');
  var submitBtn = document.getElementById('orderConfirmModalSubmit');

  function escapeHtml(s) {
    if (s == null) return '';
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  window.openOrderConfirmModal = function(payload) {
    if (!payload || !payload.action) return;
    var action = payload.action === 'Sell' ? 'Sell' : 'Buy';
    var right = payload.right || '';
    var strike = payload.strike_price != null ? String(payload.strike_price) : '';
    var qty = payload.quantity != null ? String(payload.quantity) : '';
    var price = payload.price != null ? String(payload.price) : '';
    var stock = payload.stock_code || '';
    var expiry = payload.expiry_date || '';
    var exchange = payload.exchange_code || '';

    document.getElementById('orderConfirm_product_type').value = payload.product_type || 'Options';
    document.getElementById('orderConfirm_stock_code').value = stock;
    document.getElementById('orderConfirm_exchange_code').value = exchange;
    document.getElementById('orderConfirm_expiry_date').value = expiry;
    document.getElementById('orderConfirm_right').value = right;
    document.getElementById('orderConfirm_strike_price').value = strike;
    document.getElementById('orderConfirm_quantity').value = qty;
    document.getElementById('orderConfirm_price').value = price;
    document.getElementById('orderConfirm_action').value = action;

    var qtyInput = document.getElementById('orderConfirmModalQty');
    var priceInput = document.getElementById('orderConfirmModalPrice');
    if (qtyInput) qtyInput.value = qty;
    if (priceInput) priceInput.value = price;

    var qtyDisp = (qty === '' || qty == null) ? '—' : escapeHtml(qty);
    var priceDisp = (price === '' || price == null) ? '—' : escapeHtml(price);
    var actionClass = action === 'Sell' ? 'order-confirm-action order-confirm-action-sell' : 'order-confirm-action order-confirm-action-buy';
    summaryEl.innerHTML =
      '<span class="' + actionClass + '">' + escapeHtml(action) + '</span> ' + escapeHtml(stock) + ' ' + escapeHtml(expiry) + ' ' + escapeHtml(right) + ' ' + escapeHtml(strike);

    var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    modal.show();
  };

  submitBtn.addEventListener('click', function() {
    var qtyInput = document.getElementById('orderConfirmModalQty');
    var priceInput = document.getElementById('orderConfirmModalPrice');
    if (qtyInput) document.getElementById('orderConfirm_quantity').value = qtyInput.value || '';
    if (priceInput) document.getElementById('orderConfirm_price').value = priceInput.value || '';
    formEl.submit();
  });
})();
</script>
