<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <script>
      (function(){
        var t = localStorage.getItem('theme_pref') || 'dark';
        document.documentElement.setAttribute('data-bs-theme', t);
        function apply(theme) {
          document.documentElement.setAttribute('data-bs-theme', theme);
          localStorage.setItem('theme_pref', theme);
          var nav = document.querySelector('.navbar');
          if (nav) {
            nav.classList.remove('navbar-light', 'navbar-dark');
            nav.classList.add(theme === 'light' ? 'navbar-light' : 'navbar-dark');
          }
          var dropdowns = document.querySelectorAll('.dropdown-menu-dark');
          dropdowns.forEach(function(el) {
            if (theme === 'light') el.classList.remove('dropdown-menu-dark');
            else el.classList.add('dropdown-menu-dark');
          });
        }
        window.applyTheme = apply;
        document.addEventListener('DOMContentLoaded', function() {
          apply(localStorage.getItem('theme_pref') || 'dark');
          document.querySelectorAll('.theme-toggle-dark').forEach(function(btn) {
            btn.onclick = function() { apply('light'); };
          });
          document.querySelectorAll('.theme-toggle-light').forEach(function(btn) {
            btn.onclick = function() { apply('dark'); };
          });
        });
      })();
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    {% block title %}
    <title>Breeze Web</title>
    {% endblock %}
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='/favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', path='/site.webmanifest') }}">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <!-- <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', path='/css/custom.css') }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-body text-body">
    <a href="#main" class="visually-hidden-focusable">Skip to content</a>
    {% include "common_navbar.html" %}

    <main id="main" class="py-5" tabindex="-1">
    {% block content %}
    {% endblock %}
    </main>

    {% include "_footer.html" with context %}

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var type = params.get('toast');
        var msg = params.get('msg') || params.get('message');
        if (type && msg) {
          var alertClass = type === 'success' ? 'alert-success' : type === 'danger' ? 'alert-danger' : type === 'warning' ? 'alert-warning' : 'alert-info';
          var container = document.getElementById('toast-container');
          var toastEl = document.createElement('div');
          toastEl.className = 'toast show align-items-center text-bg-' + (type === 'success' ? 'success' : type === 'danger' ? 'danger' : type === 'warning' ? 'warning' : 'primary') + ' border-0';
          toastEl.setAttribute('role', 'alert');
          toastEl.innerHTML = '<div class="d-flex"><div class="toast-body">' + msg.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>';
          container.appendChild(toastEl);
          var toast = new bootstrap.Toast(toastEl, { delay: 4000 });
          toast.show();
          toastEl.addEventListener('hidden.bs.toast', function() { toastEl.remove(); });
          history.replaceState(null, '', window.location.pathname + (window.location.hash || ''));
        }
      })();
    </script>
    {% block scripts %}
    {% endblock %}
  </body>
</html>
