version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_BACKEND_URL: "http://proxy:3000"
      # Dev-style rewrites inside Next (nginx also proxies /icici-return and /auth to backend)
      BACKEND_UPSTREAM_URL: "http://backend:8000"
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "3000:3000"

