name: Manual AWS Deploy for Rakesh S (EC2 + Elastic IP)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  deploy:
    name: Provision and deploy production
    runs-on: ubuntu-latest
    environment:
      name: production-rakesh
    env:
      AWS_REGION: ap-south-1
      INSTANCE_TYPE: t4g.small
      IMAGE_TAG: latest
      REPO_NAME: icici-breeze-modern
      EC2_USER: ubuntu
      APP_NAME: icici-breeze-modern-web
      EC2_TAG: icici-breeze-modern-EC2
      # EC2_KEY_NAME: icici-breeze-modern-KP
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Optional: set GitHub secret EBS_DATA_VOLUME_ID (vol-...) to a gp3 volume in the same AZ as
      # the default VPC subnet, with DeleteOnTermination=false. Workflow attaches it as /dev/sdf;
      # cloud-init waits, formats if empty (ext4, label breeze-core-data), mounts /opt/icici-breeze-modern/data.
      - name: Build startup script
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          APP_ENV_FILE_B64: ${{ secrets.APP_ENV_FILE_B64 }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          EXPECT_DATA_VOLUME=0
          if [ -n "${{ secrets.EBS_DATA_VOLUME_ID }}" ]; then
            EXPECT_DATA_VOLUME=1
          fi
          cat > user-data.sh <<EOF
          #!/usr/bin/env bash
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl gnupg lsb-release

          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc

          echo \
            "deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
            \$(. /etc/os-release && echo "\$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list

          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl enable docker
          systemctl start docker

          if [ "${EXPECT_DATA_VOLUME}" = "1" ]; then
            DATA_DEV=""
            for _ in \$(seq 1 90); do
              if [ -b /dev/nvme1n1 ]; then DATA_DEV=/dev/nvme1n1; break; fi
              if [ -b /dev/xvdf ]; then DATA_DEV=/dev/xvdf; break; fi
              if [ -b /dev/sdf ]; then DATA_DEV=/dev/sdf; break; fi
              sleep 2
            done
            if [ -z "\${DATA_DEV}" ]; then
              echo "ERROR: Persistent data volume not visible (attach as /dev/sdf; expect nvme1n1 on Nitro)."
              exit 1
            fi
            if ! blkid "\${DATA_DEV}" >/dev/null 2>&1; then
              mkfs.ext4 -L breeze-core-data -E discard "\${DATA_DEV}"
            fi
            mkdir -p /opt/icici-breeze-modern/data
            mount "\${DATA_DEV}" /opt/icici-breeze-modern/data
            if ! grep -q 'LABEL=breeze-core-data /opt/icici-breeze-modern/data' /etc/fstab; then
              echo 'LABEL=breeze-core-data /opt/icici-breeze-modern/data ext4 defaults,nofail 0 2' >> /etc/fstab
            fi
          else
            mkdir -p /opt/icici-breeze-modern/data
          fi

          # Write runtime env file from GitHub secret (base64-encoded .env content)
          printf '%s' "${APP_ENV_FILE_B64}" | base64 -d > /opt/icici-breeze-modern/.env
          chmod 600 /opt/icici-breeze-modern/.env

          # Login and pull from GHCR
          echo "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

          # Run app container
          docker rm -f icici-breeze-modern-app || true
          docker run -d \
            --name icici-breeze-modern-app \
            --restart unless-stopped \
            --env-file /opt/icici-breeze-modern/.env \
            -v /opt/icici-breeze-modern/data:/app/backend/data \
            -p 80:3000 \
            "${IMAGE_NAME}:${IMAGE_TAG}"
          EOF
          chmod +x user-data.sh

      - name: Find VPC and subnet
        id: network
        run: |
          VPC_ID=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
          SUBNET_ID=$(aws ec2 describe-subnets --filters Name=vpc-id,Values="$VPC_ID" Name=default-for-az,Values=true --query 'Subnets[0].SubnetId' --output text)
          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          echo "subnet_id=$SUBNET_ID" >> "$GITHUB_OUTPUT"

      - name: Check data volume AZ matches subnet AZ
        env:
          VOLUME_ID: ${{ secrets.EBS_DATA_VOLUME_ID }}
        run: |
          if [ -z "$VOLUME_ID" ]; then
            echo "No EBS_DATA_VOLUME_ID secret; skipping AZ check."
            exit 0
          fi
          SUBNET_ID="${{ steps.network.outputs.subnet_id }}"
          SUBNET_AZ=$(aws ec2 describe-subnets \
            --subnet-ids "$SUBNET_ID" \
            --query 'Subnets[0].AvailabilityZone' \
            --output text)
          VOL_AZ=$(aws ec2 describe-volumes \
            --volume-ids "$VOLUME_ID" \
            --query 'Volumes[0].AvailabilityZone' \
            --output text)
          echo "Subnet $SUBNET_AZ (subnet $SUBNET_ID) vs volume $VOL_AZ ($VOLUME_ID)"
          if [ "$SUBNET_AZ" != "$VOL_AZ" ]; then
            echo "::error::EBS_DATA_VOLUME_ID must live in the same AZ as the launch subnet. Move or recreate the volume (or subnet). Subnet AZ: $SUBNET_AZ. Volume AZ: $VOL_AZ."
            exit 1
          fi

      - name: Ensure security group exists
        id: sg
        run: |
          authorize_ingress_or_duplicate_ok() {
            local out ec=0
            out=$(aws ec2 authorize-security-group-ingress "$@" 2>&1) || ec=$?
            if [ "$ec" -eq 0 ]; then
              return 0
            fi
            if echo "$out" | grep -q 'InvalidPermission\.Duplicate'; then
              echo "Ingress already present (ok): $*"
              return 0
            fi
            printf '%s\n' "$out" >&2
            return "$ec"
          }

          SG_ID=$(aws ec2 describe-security-groups \
            --filters Name=vpc-id,Values=${{ steps.network.outputs.vpc_id }} Name=group-name,Values=${EC2_TAG}-sg \
            --query 'SecurityGroups[0].GroupId' --output text)

          if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
            SG_ID=$(aws ec2 create-security-group \
              --group-name ${EC2_TAG}-sg \
              --description "Security group for ${APP_NAME}" \
              --vpc-id ${{ steps.network.outputs.vpc_id }} \
              --query 'GroupId' --output text)
          fi

          authorize_ingress_or_duplicate_ok --group-id "$SG_ID" --protocol tcp --port 22 --cidr 0.0.0.0/0
          authorize_ingress_or_duplicate_ok --group-id "$SG_ID" --protocol tcp --port 80 --cidr 0.0.0.0/0

          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve Ubuntu AMI
        id: ami
        run: |
          AMI_ID=$(aws ssm get-parameter \
            --name /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id \
            --query 'Parameter.Value' --output text)
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"

      # Tear down old deployment first so EIP frees and no duplicate tagged instances remain.
      - name: Terminate previous app instances and wait
        run: |
          NON_TERMINATED=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${EC2_TAG}" \
            --query 'Reservations[].Instances[?State.Name!=`terminated`].InstanceId' \
            --output text)
          NON_TERMINATED=$(echo "$NON_TERMINATED" | xargs)

          if [ -z "$NON_TERMINATED" ] || [ "$NON_TERMINATED" = "None" ]; then
            echo "No existing instances with tag Name=${EC2_TAG} (non-terminated)."
            exit 0
          fi

          echo "Waiting for termination of: $NON_TERMINATED"

          TO_TERMINATE=$(aws ec2 describe-instances \
            --instance-ids $NON_TERMINATED \
            --query 'Reservations[].Instances[?State.Name==`pending` || State.Name==`running` || State.Name==`stopped` || State.Name==`stopping`].InstanceId' \
            --output text)
          TO_TERMINATE=$(echo "$TO_TERMINATE" | xargs)

          if [ -n "$TO_TERMINATE" ] && [ "$TO_TERMINATE" != "None" ]; then
            aws ec2 terminate-instances --instance-ids $TO_TERMINATE
          fi

          aws ec2 wait instance-terminated --instance-ids $NON_TERMINATED
          echo "All prior tagged instances are terminated."

      - name: Launch EC2 instance
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "${{ steps.ami.outputs.ami_id }}" \
            --instance-type "${INSTANCE_TYPE}" \
            --subnet-id "${{ steps.network.outputs.subnet_id }}" \
            --security-group-ids "${{ steps.sg.outputs.sg_id }}" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${EC2_TAG}}]" \
            --user-data file://user-data.sh \
            --query 'Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for instance running
        run: aws ec2 wait instance-running --instance-ids "${{ steps.ec2.outputs.instance_id }}"

      - name: Attach persistent data volume
        env:
          VOLUME_ID: ${{ secrets.EBS_DATA_VOLUME_ID }}
        run: |
          if [ -z "$VOLUME_ID" ]; then
            echo "No EBS_DATA_VOLUME_ID secret; skipping attach."
            exit 0
          fi
          aws ec2 attach-volume \
            --volume-id "${VOLUME_ID}" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --device /dev/sdf
          aws ec2 wait volume-in-use --volume-ids "${VOLUME_ID}"

      # Never allocate a new EIP. Prefer secret EIP_ALLOCATION_ID (disassociate if busy), else first unassociated EIP.
      - name: Associate Elastic IP
        id: eip
        env:
          EIP_ALLOCATION_ID: ${{ secrets.EIP_ALLOCATION_ID }}
        run: |
          if [ -n "${EIP_ALLOCATION_ID}" ]; then
            ALLOCATION_ID="${EIP_ALLOCATION_ID}"
            ASSOC_ID=$(aws ec2 describe-addresses \
              --allocation-ids "$ALLOCATION_ID" \
              --query 'Addresses[0].AssociationId' \
              --output text)
            if [ -n "$ASSOC_ID" ] && [ "$ASSOC_ID" != "None" ]; then
              echo "Disassociating EIP from existing association: $ASSOC_ID"
              aws ec2 disassociate-address --association-id "$ASSOC_ID"
              sleep 8
            fi
          else
            ALLOCATION_ID=$(aws ec2 describe-addresses \
              --query 'Addresses[?AssociationId==null] | [0].AllocationId' \
              --output text)
            if [ "$ALLOCATION_ID" = "None" ] || [ -z "$ALLOCATION_ID" ]; then
              echo "::error::No unassociated Elastic IP found. Set secret EIP_ALLOCATION_ID (eipalloc-...) or disassociate an EIP, then re-run."
              exit 1
            fi
          fi

          aws ec2 associate-address \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --allocation-id "$ALLOCATION_ID"

          PUBLIC_IP=$(aws ec2 describe-addresses --allocation-ids "$ALLOCATION_ID" --query 'Addresses[0].PublicIp' --output text)
          echo "allocation_id=$ALLOCATION_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Wait for cloud-init bootstrap
        run: sleep 60

      # Scheduler target uses the same IAM role as this workflow (OIDC). That role's trust policy must include
      # BOTH: GitHub OIDC (token.actions.githubusercontent.com) AND scheduler.amazonaws.com. It also needs
      # iam:PassRole on its own role ARN with iam:PassedToService = scheduler.amazonaws.com (often already
      # covered by AmazonEventBridgeSchedulerFullAccess). EC2 start/stop must be allowed on the instance.
      - name: Configure Auto Start/Stop Schedules
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text)
          if [[ ! "$CALLER_ARN" =~ assumed-role/([^/]+)/ ]]; then
            echo "::error::Expected OIDC assumed-role session; got: $CALLER_ARN"
            exit 1
          fi
          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${BASH_REMATCH[1]}"

          START_TARGET=$(jq -nc \
            --arg role "$ROLE_ARN" \
            --arg id "$INSTANCE_ID" \
            '{
              Arn: "arn:aws:scheduler:::aws-sdk:ec2:startInstances",
              RoleArn: $role,
              Input: ({InstanceIds: [$id]} | tojson)
            }')

          # Weekdays 9:00 IST
          aws scheduler create-schedule \
            --name "Start-Breeze-App-${INSTANCE_ID}" \
            --schedule-expression "cron(0 9 ? * MON-FRI *)" \
            --schedule-expression-timezone "Asia/Kolkata" \
            --target "$START_TARGET" \
            --flexible-time-window '{"Mode": "OFF"}' \
            --action-after-completion NONE

          STOP_TARGET=$(jq -nc \
            --arg role "$ROLE_ARN" \
            --arg id "$INSTANCE_ID" \
            '{
              Arn: "arn:aws:scheduler:::aws-sdk:ec2:stopInstances",
              RoleArn: $role,
              Input: ({InstanceIds: [$id]} | tojson)
            }')

          # Weekdays 17:00 IST
          aws scheduler create-schedule \
            --name "Stop-Breeze-App-${INSTANCE_ID}" \
            --schedule-expression "cron(0 17 ? * MON-FRI *)" \
            --schedule-expression-timezone "Asia/Kolkata" \
            --target "$STOP_TARGET" \
            --flexible-time-window '{"Mode": "OFF"}' \
            --action-after-completion NONE

      - name: Deployment summary
        run: |
          echo "Instance ID: ${{ steps.ec2.outputs.instance_id }}"
          echo "Elastic IP:   ${{ steps.eip.outputs.public_ip }}"
          echo "URL:          http://${{ steps.eip.outputs.public_ip }}"
