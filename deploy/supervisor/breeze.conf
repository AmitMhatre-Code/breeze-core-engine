[program:backend]
command=/usr/local/bin/python -m uvicorn icici_breeze_backend.main:app --host 0.0.0.0 --port 8000
directory=/app/backend
user=root
autostart=true
autorestart=true
startsecs=5
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=/usr/bin/npx next start -H 0.0.0.0 -p 3001
directory=/app/frontend
user=root
autostart=true
autorestart=true
startsecs=5
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/tmp"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
startsecs=1
priority=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
