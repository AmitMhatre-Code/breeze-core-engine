[program:backend]
command=/usr/local/bin/python -m uvicorn icici_breeze_backend.main:app --host 0.0.0.0 --port 8000
directory=/app/backend
user=root
autostart=true
autorestart=true
startsecs=5
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; glibc multi-arena allocator can bloat RSS on multi-threaded Python under memory pressure;
; capping arenas trades a little allocation throughput for materially lower/steadier RSS.
environment=MALLOC_ARENA_MAX="2"

[program:chain-builder]
command=/usr/local/bin/python -m icici_breeze_backend.workers.chain_builder
directory=/app/backend
user=root
autostart=true
autorestart=true
startsecs=5
priority=150
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=MALLOC_ARENA_MAX="2"

[program:frontend]
command=/usr/local/bin/node server.js
directory=/app/frontend
user=root
autostart=true
autorestart=true
startsecs=5
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Caps V8 old-space heap so Next's standalone server can't grow unbounded on a 2GiB host.
environment=HOME="/tmp",PORT="3001",HOSTNAME="0.0.0.0",NODE_OPTIONS="--max-old-space-size=384"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
startsecs=1
priority=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
